<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Saldo Total: <span id="total-balance">0</span></h1>

        <form id="transaction-form">
            <input type="text" id="item-name" placeholder="Nama Barang" required>
            <input type="number" id="item-amount" placeholder="Jumlah" required>
            <select id="item-category" required>
                <option value="Makanan">Makanan</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Hiburan">Hiburan</option>
            </select>
            <button type="submit">Tambah Transaksi</button>
        </form>

        <canvas id="expense-chart" width="400" height="400"></canvas>

        <ul id="transaction-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
